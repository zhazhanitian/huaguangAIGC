services:
  mysql:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: huaguang_aigc
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    volumes:
      - mysql_data_school3:/var/lib/mysql
      - ./server/scripts/huaguang_aigc-20260302-230054.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - redis_data_school3:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3201:3001"
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - DB_SYNC=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_DATABASE=huaguang_aigc
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=huaguang-aigc-jwt-secret-2026-school3
      - JWT_EXPIRES_IN=7d
      - TASK_QUEUE_ENABLED=false
    depends_on:
      - mysql
      - redis
    volumes:
      - ./server/uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3202:80"
    depends_on:
      - server

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3203:80"
    depends_on:
      - server

volumes:
  mysql_data_school3:
  redis_data_school3:
