version: "3.8"

services:
  mysql:
    image: mariadb:10.11
    container_name: wanglong-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wanglong_aigc
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/scripts/huaguang_aigc-20260302-230054.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: wanglong-redis
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wanglong-server
    restart: always
    ports:
      - "3011:3001"
    # 显式加载 server/.env，避免 compose 目录下没有 .env 时 OSS 等环境变量为空
    env_file:
      - ./server/.env.wanglong
    environment:
      - PORT=3001
      - DB_SYNC=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_DATABASE=wanglong_aigc
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=wanglong-aigc-jwt-secret-2026
      - JWT_EXPIRES_IN=7d
      - TASK_QUEUE_ENABLED=true
    depends_on:
      - mysql
      - redis
    volumes:
      - ./server/uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wanglong-web
    restart: always
    ports:
      - "3012:80"
    depends_on:
      - server

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: wanglong-admin
    restart: always
    ports:
      - "3013:80"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
